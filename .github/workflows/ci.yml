name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. dorny/paths-filter reads the PR's changed files through the API on pull_request events.
permissions:
  contents: read
  pull-requests: read

jobs:
  # Decide which areas changed so each job only runs when it matters. Pushes to main run everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ github.event_name == 'push' || steps.filter.outputs.app == 'true' }}
      sdk-node: ${{ github.event_name == 'push' || steps.filter.outputs.sdk-node == 'true' }}
      sdk-python: ${{ github.event_name == 'push' || steps.filter.outputs.sdk-python == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - 'eslint.config.mjs'
              - '.github/workflows/ci.yml'
            app:
              - *shared
              - 'stacklens/**'
              - 'deploy/**'
            sdk-node:
              - *shared
              - 'sdks/node-tracer/**'
              - 'sdks/conformance/**'
              - 'examples/node/**'
            sdk-python:
              - 'sdks/python-tracer/**'
              - 'examples/python/**'
              - 'packages/contract/**'
              - 'sdks/conformance/**'
              - '.github/workflows/ci.yml'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build:packages
      - run: npm run lint

  # Contract + shared + backend + frontend (the StackLens server)
  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @stacklens/types
      - run: npm run typecheck -w @stacklens/types -w @stacklens/shared -w @stacklens/backend -w stacklens/frontend
      - run: npm test -w @stacklens/types -w @stacklens/shared -w @stacklens/backend --if-present
      - run: npm run build -w stacklens/frontend

  # Node.js SDK (@stacklens/node-tracer) + its examples + the cross-language conformance check
  sdk-node:
    needs: changes
    if: needs.changes.outputs.sdk-node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - run: npm run typecheck -w @stacklens/node-tracer
      - run: npm test -w @stacklens/node-tracer
      - run: npm run conformance:node

  # Python SDK (stacklens-python-tracer): pytest on the oldest and newest supported Python + the conformance check
  sdk-python:
    needs: changes
    if: needs.changes.outputs.sdk-python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: sdks/python-tracer/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pip install -e "sdks/python-tracer[test]"
      - run: python -m pytest -q
        working-directory: sdks/python-tracer
      # the runner itself is standard-library only; check.mjs validates against trace.schema.json
      - run: python sdks/conformance/python-tracer/run.py | node sdks/conformance/check.mjs -
      - run: python -m compileall -q examples/python

  docker:
    needs: [changes, app]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          tags: stacklens:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
