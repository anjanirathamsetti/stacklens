# Production-like stack: the StackLens server backed by PostgreSQL.
#   docker compose up --build
# Then point your apps at STACKLENS_ENDPOINT=http://localhost:4300/api/ingest
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stacklens
      POSTGRES_USER: stacklens
      POSTGRES_PASSWORD: stacklens # change for anything beyond local use
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stacklens -d stacklens']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  stacklens:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: stacklens:local
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '4300:4300'
    environment:
      DATABASE_URL: postgres://stacklens:stacklens@postgres:5432/stacklens
      STACKLENS_RETENTION_DAYS: '30'
      # SERVICENOW_INSTANCE: dev12345
      # SERVICENOW_USERNAME: stacklens.integration
      # SERVICENOW_PASSWORD: change-me
    restart: unless-stopped

volumes:
  postgres-data:
